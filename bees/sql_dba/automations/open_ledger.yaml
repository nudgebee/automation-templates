# Opens the install's SQL DBA ledger issue. Read tier (it only writes to the tracker), so it runs
# without asking. The bee opens one per install and finds it again before opening another.
summary: Open the SQL DBA ledger issue for one install.
slug: sql_dba__open_ledger
name: "Open the SQL DBA ledger issue"
description: "Creates the issue that holds the findings, plans and decisions for this install's databases."
version: 1.0.0
definition:
  version: "v1"
  inputs:
    - { id: project_key, type: string, required: true, description: "The tracker_project setting: owner/name, or a Jira key" }
    - { id: title, type: string, required: true, description: "SQL DBA: <databases setting>" }
    - { id: description, type: string, required: true, description: "Which databases, which checks, and how to accept a finding" }
  triggers:
    - type: manual
  tasks:
    - id: create
      type: tickets.create
      params:
        integration_id: "{{ Install.integrations.tracker.id }}"
        project_key: "{{ Inputs.project_key }}"
        title: "{{ Inputs.title }}"
        description: "{{ Inputs.description }}"
  timeout: "2m"
