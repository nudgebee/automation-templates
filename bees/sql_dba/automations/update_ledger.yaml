# Adds this run's findings to the ledger issue. Read tier: runs without asking.
summary: Add a run's findings, or the weekly report, to the SQL DBA ledger issue.
slug: sql_dba__update_ledger
name: "Comment on the SQL DBA ledger issue"
description: "Adds the new and cleared findings and the full table, or on the report day the weekly report."
version: 1.0.0
definition:
  version: "v1"
  inputs:
    - { id: project_key, type: string, required: true, description: "The tracker_project setting" }
    - { id: ticket_id, type: string, required: true, description: "The ledger issue's id or number" }
    - { id: comment, type: string, required: true, description: "This run's changes and table, or the weekly report" }
  triggers:
    - type: manual
  tasks:
    - id: comment
      type: tickets.add_comment
      params:
        integration_id: "{{ Install.integrations.tracker.id }}"
        project_key: "{{ Inputs.project_key }}"
        ticket_id: "{{ Inputs.ticket_id }}"
        comment: "{{ Inputs.comment }}"
  timeout: "2m"
