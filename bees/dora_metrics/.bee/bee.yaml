schema: bee/v1
name: dora_metrics                      # canonical: snake_case, fixed forever
display_name: DORA Metrics Bee
version: 0.2.0
description: Reports the five DORA metrics for this cluster once a week (deployment frequency, change lead time, failed deployment recovery time, change fail rate and deployment rework rate), with the deploys and alerts behind each number and what changed since last week.
author: { name: Nudgebee }

install:
  account_types: [k8s]
  scope: [namespaces]

integrations:
  - id: tracker
    types: [github, gitlab, jira]
    access: write
    required: true
    why: Keeps one report issue per cluster and adds this week's numbers to it as a comment.
  - id: repos
    types: [github, gitlab]
    access: read
    required: false
    why: Reads commit times for change lead time. Without it, lead time is reported as not available.

settings:
  tracker_project:
    type: string
    title: Report project
    description: Where the report issue goes. A repository as owner/name for GitHub or GitLab, or a Jira project key.
    required: true
  prod_namespaces:
    type: string
    title: Production namespaces
    description: Comma-separated namespaces that count as production. Empty means every namespace the bee is installed on.
    default: ""
  failure_window_minutes:
    type: number
    title: Failure window
    description: A deploy counts as failed when a high-priority alert fires on the same workload within this many minutes after it, or when it is rolled back.
    default: 60
  report_days:
    type: number
    title: Report period
    description: How many days each report covers.
    default: 7

output:                                 # summary, evidence and runs are built in
  verdict: { enum: [full, partial, none] }      # how many of the five metrics have numbers
  metrics:                              # a weekly period's numbers, once its comment is posted
    type: array
    items:
      type: object
      properties:
        target: { type: string }        # the account name
        metric:
          type: string
          enum: [deploys, failed_deploys, rework_deploys, deployment_frequency, change_lead_time, failed_deployment_recovery_time, change_fail_rate, deployment_rework_rate]
        value: { type: number }
      required: [target, metric, value]
  # checked and findings are required next to metrics_field. DORA numbers are not checks that
  # pass or fail, so both are always []: an item would show a 50% change fail rate as "OK".
  checked:
    type: array
    items:
      type: object
      properties:
        target: { type: string }
        check: { type: string }
      required: [target, check]
  findings:
    type: array
    items:
      type: object
      properties:
        target: { type: string }
        check: { type: string }
        severity: { enum: [info, warning, critical] }
        title: { type: string }
      required: [target, check, severity, title]

# The platform keeps each weekly period's numbers (bee_metrics) for the DORA dashboard. A metric
# that could not be read, or has nothing to measure, has no item: never 0. Counts are events, so
# any range adds up; rates and medians are gauges, one point per week.
findings:
  checked_field: checked
  findings_field: findings
  metrics_field: metrics
  units: [deploys, deploys_per_day, hours, minutes, percent]
  metrics:
    deploys: { kind: events, unit: deploys }
    failed_deploys: { kind: events, unit: deploys }
    rework_deploys: { kind: events, unit: deploys }
    deployment_frequency: { kind: gauge, unit: deploys_per_day }
    change_lead_time: { kind: gauge, unit: hours }                        # median
    failed_deployment_recovery_time: { kind: gauge, unit: minutes }       # median
    change_fail_rate: { kind: gauge, unit: percent }
    deployment_rework_rate: { kind: gauge, unit: percent }

budget:
  # Uncached input + output per run; input read from the prompt cache does not count.
  max_tokens_per_run: 400000
  max_runs_per_day: 2                   # runs by hand count too: one must not cancel the weekly run
  timeout: 15m
