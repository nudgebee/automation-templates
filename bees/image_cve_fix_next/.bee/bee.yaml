schema: bee/v1
name: image_cve_fix_next                   # canonical: snake_case, fixed forever
display_name: Image CVE Fix Bee (next)
version: 1.2.0
description: Brings down fixable Critical and High CVEs on the images running in the namespaces you choose. For each image it finds the cheapest fix that works, scans a newer version before asking to upgrade, opens the pull request, and proves the result on the running image.
author: { name: Nudgebee }

install:
  account_types: [k8s]
  scope: [namespaces]

integrations:
  - id: repos
    types: [github]
    access: write
    required: true
    why: Opens the pull request for a fix. Asks every time.

settings:
  namespaces:
    type: string
    title: Namespaces
    description: Comma-separated namespaces to work on. The bee refuses to run without them.
    required: true

output:                                 # summary, evidence and runs are built in
  stage: { enum: [no_scope, nothing_open, working, unsure] }
  verdict: { enum: [improved, unchanged, worse, none] }
  open_findings: { type: number }
  checked:
    type: array
    items:
      type: object
      properties:
        target: { type: string }
        check: { type: string, enum: [fixable_cves] }
      required: [target, check]
  findings:
    type: array
    items:
      type: object
      properties:
        target: { type: string }
        check: { type: string, enum: [fixable_cves] }
        severity: { enum: [warning, critical] }
        title: { type: string }
        detail: { type: string }
        value: { type: number }
        unit: { enum: [cves] }
        link: { type: string }
        state: { enum: [open, planned] }
      required: [target, check, severity, title, detail, value, unit]
  metrics:
    type: array
    items:
      type: object
      properties:
        target: { type: string }
        metric: { type: string, enum: [fixable_critical, fixable_high, cves_fixed, prs_opened] }
        value: { type: number }
      required: [target, metric, value]
  plan:
    type: object

# The Bee page is the report: one finding per image with fixable Critical or High CVEs (its fix, its
# pull request), the totals and what each fix cleared on the dashboard. The plan (each image's state,
# open scans, pull requests, declined versions) is kept by the platform and handed to the next run.
findings:
  checked_field: checked
  findings_field: findings
  units: [cves, prs]
  metrics_field: metrics
  metrics:
    fixable_critical: { kind: gauge, unit: cves }
    fixable_high: { kind: gauge, unit: cves }
    cves_fixed: { kind: events, unit: cves }
    prs_opened: { kind: events, unit: prs }

memory:
  plan_field: plan

budget:
  # Uncached input + output per run; input read from the prompt cache does not count.
  max_tokens_per_run: 400000
  max_runs_per_day: 2
  timeout: 15m
