slug: kubernetes_namespace_health_check
name: "Kubernetes Namespace Health Check"
description: >-
  Scheduled AI review of cluster health for the namespaces you choose — namespace health plus any
  recent OOMs or restarts — posted to a Slack channel.
category: "kubernetes"
icon: "health_and_safety"
status: ACTIVE
tags:
  labels:
    - "diagnostic"
    - "notification"
    - "read-only"
template_variables:
  - id: "namespaces"
    input_ref: "namespaces"
    display_name: "Namespaces"
    help_text: "Comma-separated list of namespaces to health-check."
    placeholder: "nudgebee, redis, rabbit"
    required: true
    type: "string"
  - id: "slack_channel"
    input_ref: "slack_channel"
    display_name: "Slack Channel"
    help_text: "Slack channel ID that receives the health report."
    placeholder: "C09UZE6Q2V9"
    required: true
    type: "string"
definition:
  version: "v1"
  timeout: "1800s"
  inputs:
    - id: "namespaces"
      type: "string"
      description: "Comma-separated namespaces to health-check."
      required: true
    - id: "slack_channel"
      type: "string"
      description: "Slack channel ID for the health report."
      required: true
  output: {}
  tasks:
    - id: "review-nudgebee-health"
      type: "llm.investigate"
      params:
        message: |
          Investigate/Review Cluster Health
          - health check on {{ Inputs.namespaces }} namespace(s)
          - Any Recent OOMs/Restarts
        response_format: "text"
        session_scope: "execution"
      layout:
        x: 400
        y: 280
    - id: "send-notification"
      type: "notifications.im"
      params:
        channel: "{{ Inputs.slack_channel }}"
        message: |
          {{ Tasks['review-nudgebee-health'].output.data}}
        provider: "slack"
      depends_on:
        - "review-nudgebee-health"
      layout:
        x: 400
        y: 460
  triggers:
    - type: "manual"
      params: {}
      layout:
        x: 210
        y: 100
    - type: "schedule"
      params:
        cron: "0 0 * * *"
      layout:
        x: 590
        y: 100
  retry_policy:
    maximum_attempts: 3
    initial_interval: "1s"
    maximum_interval: "60s"
    backoff_coefficient: 2
