slug: k8s_right_sizing_with_approval
name: K8s Right-Sizing with Approval
description: Posts a Kubernetes workload's current CPU and memory to Slack for team approval, and applies vertical right-sizing (up or down) only after explicit approval.
category: kubernetes
icon: sliders
status: ACTIVE
tags:
  use_case: cost-optimization
  integrations:
  - k8s
  - slack
  - llm
definition:
  version: v1
  inputs:
  - id: namespace
    type: string
    required: true
  - id: workload_name
    type: string
    required: true
  - id: workload_kind
    type: string
    required: false
    default: Deployment
  - id: approval_channel
    type: string
    required: true
  - id: account_id
    type: string
    required: false
  - id: direction
    type: string
    required: true
    default: down
  triggers:
  - type: manual
  - type: schedule
    params:
      cron: 0 10 * * 1
  tasks:
  - id: get_current_resources
    type: k8s.cli
    params:
      command: get {{ Inputs.workload_kind | lower }} {{ Inputs.workload_name }} -n {{ Inputs.namespace }} -o jsonpath='{.spec.template.spec.containers[*].resources}'
      account_id: '{{ Inputs.account_id }}'
  - id: summarize
    type: llm.summary
    depends_on:
    - get_current_resources
    params:
      message: |-
        Summarize these K8s container resources in a concise, human-readable format, and say what scaling CPU and memory {{ Inputs.direction }} by 20% would change.

        Current: {{ Tasks.get_current_resources.output }}
  - id: request_approval
    type: core.approval
    depends_on:
    - summarize
    params:
      message: |-
        📊 *Right-Sizing Recommendation*
        *Workload:* {{ Inputs.namespace }}/{{ Inputs.workload_name }}

        {{ Tasks.summarize.output.response }}

        Approve to scale its CPU and memory *{{ Inputs.direction }}* by 20%?
      approval_type: instant_message
      im_provider: slack
      im_channel: '{{ Inputs.approval_channel }}'
      approval_options:
      - approve
      - reject
  - id: apply_recommendation
    type: k8s.vertical_rightsize
    depends_on:
    - request_approval
    if: '{{ Tasks.request_approval.output.status == ''approve'' }}'
    params:
      namespace: '{{ Inputs.namespace }}'
      name: '{{ Inputs.workload_name }}'
      kind: '{{ Inputs.workload_kind }}'
      account_id: '{{ Inputs.account_id }}'
      direction: '{{ Inputs.direction }}'
      cpu:
        change_pct: 20
      memory:
        change_pct: 20
    hooks:
      success:
      - type: notifications.im
        params:
          provider: slack
          channel: '{{ Inputs.approval_channel }}'
          message: ✅ *Right-sizing applied* to {{ Inputs.namespace }}/{{ Inputs.workload_name }}
      failure:
      - type: notifications.im
        params:
          provider: slack
          channel: '{{ Inputs.approval_channel }}'
          message: ❌ *Right-sizing failed* for {{ Inputs.namespace }}/{{ Inputs.workload_name }}
  - id: notify_rejected
    type: notifications.im
    depends_on:
    - request_approval
    if: '{{ Tasks.request_approval.output.status == ''reject'' }}'
    params:
      provider: slack
      channel: '{{ Inputs.approval_channel }}'
      message: ⏭️ *Right-sizing skipped* for {{ Inputs.namespace }}/{{ Inputs.workload_name }} — rejected by {{ Tasks.request_approval.output.approved_by }}
template_variables:
- id: slack_channel
  input_ref: approval_channel
  display_name: Approval Channel
  help_text: Slack channel for posting approval requests
  required: true
  type: string
  group: Notifications
- id: k8s_account
  input_ref: account_id
  display_name: Kubernetes Account
  help_text: Nudgebee account with K8s cluster access
  required: false
  type: account
  group: Infrastructure
- id: direction
  input_ref: direction
  display_name: Direction
  help_text: Scale the workload's CPU and memory down (save cost) or up (more headroom)
  required: true
  type: string
  options:
  - down
  - up
  group: Settings
