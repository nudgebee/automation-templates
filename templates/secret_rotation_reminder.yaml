slug: secret_rotation_reminder
name: Secret Rotation Reminder
description: Runs on a schedule to check the age of secrets and API keys by querying AWS Secrets Manager or IAM. Sends warnings for keys approaching rotation deadlines and creates tickets for overdue rotations.
category: security
icon: key
status: ACTIVE
tags:
  use_case: secret-rotation
  integrations:
  - aws
  - slack
  - tickets
definition:
  version: v1
  inputs:
  - id: notification_channel
    type: string
    required: true
  - id: max_key_age_days
    type: string
    required: false
    default: '90'
  - id: ticket_integration_id
    type: string
    required: false
  - id: project_key
    type: string
    required: false
  - id: account_id
    type: string
    required: false
  triggers:
  - type: schedule
    params:
      cron: 0 9 * * 1
  - type: manual
  tasks:
  - id: list_access_keys
    type: cloud.aws.cli
    params:
      command: iam list-users --query 'Users[].UserName' --output json
      account_id: '{{ Inputs.account_id }}'
  - id: get_key_ages
    type: cloud.aws.cli
    depends_on:
    - list_access_keys
    params:
      command: iam generate-credential-report && sleep 2 && aws iam get-credential-report --query 'Content' --output text | base64 -d
      account_id: '{{ Inputs.account_id }}'
    failure_policy:
      action: continue
  - id: list_secrets
    type: cloud.aws.cli
    params:
      command: secretsmanager list-secrets --query 'SecretList[].{Name:Name,LastRotatedDate:LastRotatedDate,LastChangedDate:LastChangedDate}' --output json
      account_id: '{{ Inputs.account_id }}'
    failure_policy:
      action: continue
  - id: analyze_rotation
    type: llm.summary
    depends_on:
    - get_key_ages
    - list_secrets
    params:
      message: |-
        Analyze these credentials for rotation compliance. Flag any keys or secrets older than {{ Inputs.max_key_age_days }} days. Group them as: OVERDUE (must rotate immediately), WARNING (approaching deadline), OK.

        ### IAM Credential Report
        {{ Tasks.get_key_ages.output }}

        ### Secrets Manager
        {{ Tasks.list_secrets.output | tojson }}
  - id: notify
    type: notifications.im
    depends_on:
    - analyze_rotation
    params:
      provider: slack
      channel: '{{ Inputs.notification_channel }}'
      message: |-
        🔑 *Secret Rotation Report*

        {{ Tasks.analyze_rotation.output.response }}
  - id: create_ticket
    type: tickets.create
    depends_on:
    - analyze_rotation
    if: '{{ Inputs.ticket_integration_id and ''OVERDUE'' in Tasks.analyze_rotation.output.response }}'
    params:
      integration_id: '{{ Inputs.ticket_integration_id }}'
      title: '[Security] Overdue secret/key rotation detected'
      description: '{{ Tasks.analyze_rotation.output.response }}'
      project_key: '{{ Inputs.project_key }}'
      severity: High
template_variables:
- id: slack_channel
  input_ref: notification_channel
  display_name: Security Channel
  help_text: Slack channel for rotation alerts
  required: true
  type: string
  group: Notifications
- id: max_age_days
  input_ref: max_key_age_days
  display_name: Max Key Age (days)
  help_text: Keys older than this will trigger alerts
  placeholder: '90'
  required: false
  type: string
  group: Thresholds
- id: ticket_integration
  input_ref: ticket_integration_id
  display_name: Ticket Integration
  help_text: Integration for creating rotation tickets
  required: false
  type: integration
  group: Integrations
